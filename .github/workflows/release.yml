# Релиз образа: тег v<версия cdxgen> (или ручной запуск) → пайплайн безопасности → multi-arch сборка и публикация
# в Docker Hub и GHCR с provenance и SBOM-аттестациями, подпись cosign keyless → на теге GitHub Release с заметками,
# SBOM и схемами во вложениях и описание репозитория на Docker Hub.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  # Адреса публикации. В форке заменить на свои
  DOCKERHUB_IMAGE: docker.io/geminishkv/cdxgen-distroless
  GHCR_IMAGE: ghcr.io/geminishkv/cdxgen-distroless
  PLATFORMS: linux/amd64,linux/arm64
jobs:
  security:
    uses: ./.github/workflows/security.yml  # zizmor: ignore[self-repository] actionlint 1.7.12 синтаксис $/ не принимает
    permissions:
      contents: read
      pull-requests: write  # job report в security.yml; на теге комментария нет, право не используется
  publish:
    name: publish
    needs: security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write  # push в GHCR
      id-token: write  # cosign keyless (Sigstore Fulcio) и аттестации provenance
      attestations: write  # actions/attest-build-provenance
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: python3 scripts/release_version.py >> "$GITHUB_OUTPUT"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      # Образы эмуляторов, сборщика и генератора SBOM закреплены по digest: sha на uses: их не пинит, по умолчанию это плавающие теги
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4.0.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      # Секреты репозитория (Settings - Secrets and variables - Actions), в форке завести свои:
      # DOCKERHUB_USERNAME - логин Docker Hub, DOCKERHUB_TOKEN - access token с правами Read & Write
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # GHCR: секрет не нужен, вход по github.token с правом packages: write
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6.0.0
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=cdxgen-distroless
            org.opencontainers.image.licenses=Apache-2.0
      - id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294  # v7.0.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CDXGEN_VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - run: |
          cosign sign --yes "$DOCKERHUB_IMAGE@$DIGEST"
          cosign sign --yes "$GHCR_IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - run: python3 scripts/release_summary.py >> "$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
      # SBOM опубликованного образа из аттестаций в реестре: вложения GitHub Release
      - run: python3 scripts/release_sbom.py
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-sbom
          path: .local/release/*.spdx.json
          include-hidden-files: true
          if-no-files-found: error
  release-notes:
    name: release-notes
    # GitHub Release тега: заметки по шаблону, во вложениях схемы и SBOM образа; на ручном запуске без тега пропускается
    needs: publish
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # создание и обновление GitHub Release, других прав у job'а нет
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-sbom
          path: .local/release
      - run: python3 scripts/release_notes.py publish
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          GITHUB_TOKEN: ${{ github.token }}
  dockerhub-description:
    name: dockerhub-description
    # Описание репозитория на Docker Hub по шаблону. Секрет DOCKERHUB_DESCRIPTION_TOKEN - отдельный access token с правами
    # Read, Write, Delete: менять описание Docker Hub разрешает только ему; в job publish со сторонними actions он не попадает
    needs: [publish, release-notes]
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/dockerhub_description.py publish
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_DESCRIPTION_TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}

# Правила gitleaks по умолчанию плюс allowlist разобранных находок; файл читают и CI, и хук pre-commit.
# Запись - конкретные коммиты и путь (condition = "AND") с причиной. Живой секрет не глушится: сначала отзыв.
# .gitleaksignore не заводить: у него нет ни причины, ни условия.

title = "cdxgen-distroless"

[extend]
useDefault = true

# Каркас записи: полный sha коммита, точный путь-регулярка, причина с датой отзыва секрета.
# [[allowlists]]
# description = "<причина, дата отзыва>"
# condition = "AND"
# commits = ["<коммит>"]
# paths = ['''^<путь>$''']
